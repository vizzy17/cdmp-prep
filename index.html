            {chapter: 8, front: "Dimensional Data Warehouse (Kimball Approach)", back: "A bottom-up approach building data marts first using dimensional star schemas."},
            {chapter: 8, front: "Corporate Information Factory (Inmon Approach)", back: "A top-down approach building a centralized normalized 3NF data warehouse first, then feeding data marts."},
            {chapter: 8, front: "Business Intelligence (BI)", back: "Technologies, applications, and practices for collecting, integrating, analyzing, and presenting business data."},
            {chapter: 8, front: "OLAP Cube", back: "A multi-dimensional array of data allowing fast aggregation, slicing, and dicing for analytical reporting."},
            {chapter: 8, front: "Slowly Changing Dimensions (SCD)", back: "Techniques for managing how to handle changes to dimensional attribute data over time (e.g., SCD Type 1, 2, 3)."},
            {chapter: 8, front: "SCD Type 1", back: "Overwriting old attribute values with new ones, losing historical context."},
            {chapter: 8, front: "SCD Type 2", back: "Creating a new record row with versioning and effective dates to track historical changes."},
            {chapter: 8, front: "ETL Process in DW", back: "Extracting data from operational source systems, transforming formats/quality, and loading into the warehouse."},
            {chapter: 8, front: "Data Lake", back: "A centralized repository storing vast amounts of raw, unformatted data in its native format."},
            {chapter: 8, front: "Data Lakehouse", back: "An architecture combining the flexibility of data lakes with the ACID transactions and governance of data warehouses."},
            {chapter: 8, front: "Metadata Repository in DW", back: "Stores technical, business, and operational information describing data warehouse structures and lineage."},
            {chapter: 8, front: "Data Mart Consolidation", back: "The challenge of bringing disparate data marts back together into a single enterprise view."},
            {chapter: 8, front: "Self-Service BI", back: "Tools and environments enabling business users to create their own reports and analyze data without IT assistance."},
            {chapter: 8, front: "Aggregates and Summaries", back: "Pre-calculated summary tables designed to accelerate query performance in analytical databases."},
            {chapter: 8, front: "Data Warehouse Load Window", back: "The designated offline timeframe during which nightly batch ETL jobs and data refreshes occur."},
            {chapter: 8, front: "Reporting Layer", back: "The front-end user interface providing dashboards, scorecards, and ad-hoc query capabilities."},
            {chapter: 8, front: "Data Lineage in DW", back: "Tracing data from original operational source systems through transformations to final warehouse reports."},
            {chapter: 8, front: "Enterprise Bus Architecture", back: "A Kimball framework linking distinct data marts using conformance dimensions."},
            {chapter: 8, front: "Non-volatile Property", back: "The warehouse characteristic where data is loaded and read, but not routinely updated or deleted."},
            {chapter: 8, front: "Time-variant Property", back: "Data in a warehouse is tracked over a long historical time horizon for trend analysis."},
            {chapter: 8, front: "Warehouse Performance Tuning", back: "Optimizing storage layout, indexing, and partitioning to ensure rapid query execution for analytics."},

            // Chapter 9: Document and Content Management
            {chapter: 9, front: "Document and Content Management (DCM)", back: "The capturing, storing, accessing, and managing of unstructured documents, files, and enterprise content."},
            {chapter: 9, front: "Unstructured Data", back: "Information that does not have a pre-defined data model or structure, such as text documents, emails, and PDFs."},
            {chapter: 9, front: "Enterprise Content Management (ECM)", back: "Strategies, methods, and tools used to capture, manage, store, preserve, and deliver content related to organizational processes."},
            {chapter: 9, front: "Document Lifecycle Management", back: "Managing electronic documents from creation and active collaboration through archiving and final disposition."},
            {chapter: 9, front: "Electronic Document Management System (EDMS)", back: "Software used to track, store, and manage electronic documents and reduce paper usage."},
            {chapter: 9, front: "Records Management", back: "The systematic control of official organizational records from creation to legal disposal or permanent preservation."},
            {chapter: 9, front: "Retention Schedule", back: "A policy defining how long specific types of documents or records must be legally retained before destruction."},
            {chapter: 9, front: "Digital Asset Management (DAM)", back: "Systems designed to store, organize, and retrieve rich media content such as photos, videos, and audio files."},
            {chapter: 9, front: "Version Control", back: "Managing incremental changes and revisions to documents to prevent accidental overwrites and track authorship."},
            {chapter: 9, front: "Check-in / Check-out", back: "A mechanism that locks a document when it is being edited by a user to prevent simultaneous conflicting changes."},
            {chapter: 9, front: "Content Metadata", back: "Descriptive tags (author, creation date, keywords) assigned to documents to enable fast searching and categorization."},
            {chapter: 9, front: "Optical Character Recognition (OCR)", back: "Technology that converts images of typed or handwritten text into machine-readable character text data."},
            {chapter: 9, front: "Taxonomy in Content Management", back: "Hierarchical classification structures used to organize documents into logical folders and categories."},
            {chapter: 9, front: "Legal Hold", back: "A directive suspending normal document destruction schedules due to pending litigation or investigations."},
            {chapter: 9, front: "Web Content Management (WCM)", back: "Software managing the creation and publication of content specifically for web and mobile interfaces."},
            {chapter: 9, front: "Enterprise Taxonomy vs. Metadata Schema", back: "Taxonomy represents hierarchical classification of content, whereas a metadata schema defines structural descriptive tags."},
            {chapter: 9, front: "Content Federation", back: "The capability to search, discover, and access content across multiple disparate repositories from a single unified interface."},

            // Chapter 10
            {chapter: 10, front: "Master Data", back: "Data about the core business entities (such as customers, products, suppliers, and locations) that are shared across systems."},
            {chapter: 10, front: "Reference Data", back: "Any data used to categorize or classify other data, or values used for descriptive purposes (e.g., currency codes, state lists)."},
            {chapter: 10, front: "Golden Record", back: "A single, authoritative, consolidated, and accurate version of a master data entity created from multiple sources."},
            {chapter: 10, front: "Master Data Management (MDM)", back: "A discipline and set of tools ensuring an organization's master data is consistent, accurate, and shared enterprise-wide."},
            {chapter: 10, front: "Reference Data Management (RDM)", back: "The process of maintaining, governing, and distributing reference data to maintain enterprise-wide semantic consistency."},
            {chapter: 10, front: "Data Stewardship in MDM", back: "Assigned business experts accountable for reviewing merge matches, resolving data conflicts, and approving definitions."},
            {chapter: 10, front: "Survivorship Rules", back: "Algorithmic rules that determine which source system's attribute value wins when merging records into a golden record."},
            {chapter: 10, front: "Entity Resolution (Data Matching)", back: "The process of identifying distinct records from various sources that refer to the same real-world entity."},
            {chapter: 10, front: "Registry Style MDM", back: "An MDM architectural pattern that creates a central index of matches without altering data inside source systems."},
            {chapter: 10, front: "Repository Style MDM", back: "An MDM pattern storing a central master repository that acts as the single source of truth and feeds source systems."},
            {chapter: 10, front: "Transactional Hub Style MDM", back: "An architecture where the MDM hub actively participates in transactional processing and coordinates updates across systems."},
            {chapter: 10, front: "Consolidated Style MDM", back: "An architecture focused on gathering data into a read-only reporting warehouse to provide a single view without operational sync."},
            {chapter: 10, front: "Data Matching Rules", back: "Deterministic or probabilistic criteria used to evaluate whether two records represent the same entity."},
            {chapter: 10, front: "Deterministic Matching", back: "Matching records based on exact matches of unique identifiers (e.g., Social Security Number, Email)."},
            {chapter: 10, front: "Probabilistic Matching", back: "Matching records using statistical weights and algorithms to calculate a percentage likelihood that records match (handling typos)."},
            {chapter: 10, front: "Hierarchy Management", back: "Handling complex relationships within master data, such as organizational charts, product categories, or corporate structures."},
            {chapter: 10, front: "Source System of Record (SOR)", back: "The designated operational system where a particular data element is originally captured or primarily managed."},
            {chapter: 10, front: "Data Enrichment", back: "Enhancing master data records by appending external third-party data (e.g., geospatial coordinates, demographic info)."},
            {chapter: 10, front: "Data Quality and MDM", back: "High-quality master data is essential because errors in core master entities propagate downstream across all dependent systems."},
            {chapter: 10, front: "Taxonomy vs. Ontology", back: "Taxonomy categorizes hierarchical reference values; ontology defines complex relationships and logical rules among concepts."},
            {chapter: 10, front: "Cross-Reference Table", back: "A mapping table linking source system primary keys to the master golden record identifier."},
            {chapter: 10, front: "COTS MDM Solutions", back: "Commercial Off-The-Shelf software packages dedicated to automating master data workflows, matching, and governance."},
            {chapter: 10, front: "Metadata in MDM", back: "Describes data lineage, transformation rules, and mapping definitions for how golden records are constructed."},
            {chapter: 10, front: "Data Governance and MDM Relationship", back: "Governance provides the sponsorship, policies, and accountability; MDM provides the operational platform and execution."},
            {chapter: 10, front: "Data Sprawl", back: "The uncontrolled proliferation of duplicate master data across isolated silos, which MDM aims to resolve."},

            // Chapter 11: Big Data and Data Science
            {chapter: 11, front: "Big Data Characteristics (The Vs)", back: "Volume (scale), Velocity (speed), Variety (formats), Veracity (truthfulness), and Value."},
            {chapter: 11, front: "Data Science", back: "An interdisciplinary field using scientific methods, algorithms, and systems to extract knowledge from structured and unstructured data."},
            {chapter: 11, front: "Hadoop Distributed File System (HDFS)", back: "A distributed file system designed to run on commodity hardware and store large datasets across clusters."},
            {chapter: 11, front: "MapReduce", back: "A programming model and processing technique for distributed computing across massive datasets."},
            {chapter: 11, front: "Apache Spark", back: "An open-source, distributed cluster-computing framework designed for fast in-memory data processing."},
            {chapter: 11, front: "Machine Learning (ML)", back: "A branch of AI focused on building applications that learn from data and improve accuracy without explicit programming."},
            {chapter: 11, front: "Feature Store", back: "A centralized repository for storing, managing, and serving machine learning features for model training and inference."},
            {chapter: 11, front: "Data Lake in Big Data", back: "Flexible storage architecture that accepts raw data without pre-structuring, supporting data science workloads."},
            {chapter: 11, front: "Unstructured Big Data", back: "Audio, video streams, clickstream logs, and social media posts requiring specialized processing frameworks."},
            {chapter: 11, front: "Data Governance in Big Data", back: "Applying provenance, cataloging, and access controls to data lakes to prevent them from becoming unmanaged data swamps."},
            {chapter: 11, front: "Lambda Architecture", back: "An architecture combining batch and real-time streaming layers to process massive data volumes with low latency."},
            {chapter: 11, front: "Kappa Architecture", back: "A software architecture pattern focused on processing all data through a single real-time stream processing engine."},
            {chapter: 11, front: "Data Fabric", back: "An architecture providing integrated, reusable data services across heterogeneous environments and storage platforms."},

            // Chapter 12: Metadata Management
            {chapter: 12, front: "Metadata Management", back: "Planning, implementing, and enforcing policies and processes to ensure easy access to high-quality, integrated metadata."},
            {chapter: 12, front: "Business Metadata", back: "Metadata focusing on the business meaning, context, definitions, and usage rules of data assets."},
            {chapter: 12, front: "Technical Metadata", back: "Metadata describing the technical characteristics of data systems, formats, structures, columns, and database schemas."},
            {chapter: 12, front: "Operational Metadata", back: "Metadata capturing details about the execution history, processing logs, job status, and frequency of data pipelines."},
            {chapter: 12, front: "Metadata Repository", back: "A centralized database or tool used to store, manage, and query enterprise metadata."},
            {chapter: 12, front: "Active Metadata", back: "Metadata that is continuously ingested, analyzed, and acted upon in real-time by intelligent automation tools."},
            {chapter: 12, front: "Passive Metadata", back: "Static metadata harvested periodically and stored for reference and manual browsing."},
            {chapter: 12, front: "Data Dictionary", back: "A repository of information about database tables, columns, data types, and structural definitions."},
            {chapter: 12, front: "Data Glossary", back: "A business-focused catalog defining corporate terms, acronyms, and business concepts."},
            {chapter: 12, front: "Metadata Harvesting", back: "Automated extraction and loading of metadata from disparate source systems into a central repository."},
            {chapter: 12, front: "Metadata Integration", back: "Harmonizing technical, business, and operational metadata so it can be queried as a unified view."},
            {chapter: 12, front: "Data Lineage and Metadata", back: "Tracing the origin, transformation history, and downstream destination of data elements using metadata."},
            {chapter: 12, front: "Impact Analysis via Metadata", back: "Using metadata relationships to determine what systems, reports, or tables will break if a data structure is modified."},
            {chapter: 12, front: "Semantic Layer", back: "An abstraction layer built on metadata that translates complex database schemas into business-friendly terms."},
            {chapter: 12, front: "Metadata Quality", back: "Ensuring metadata itself is accurate, complete, current, and consistent across the enterprise."},
            {chapter: 12, front: "Metadata Governance", back: "Defining policies and ownership for who is responsible for creating, approving, and updating metadata entries."},
            {chapter: 12, front: "Data Catalog", back: "A modern tool leveraging metadata, search, and machine learning to help users discover and trust data assets."},
            {chapter: 12, front: "ISO/IEC 11179", back: "The international standard for formulating and administering data element definitions and metadata registries."},
            {chapter: 12, front: "XML / JSON Schemas as Metadata", back: "Machine-readable metadata standards describing structure and validation rules for structured data interchange."},
            {chapter: 12, front: "ETL Metadata", back: "Metadata generated during data integration capturing source-to-target mapping rules and transformation logic."},
            {chapter: 12, front: "Business-IT Alignment via Metadata", back: "Metadata bridges the gap by linking technical schemas directly to business glossaries and policies."},
            {chapter: 12, front: "Metadata Retention Policy", back: "Rules governing how long historical metadata logs must be kept for auditing and compliance."},
            {chapter: 12, front: "Implicit vs. Explicit Metadata", back: "Explicit metadata is intentionally documented; implicit metadata is automatically derived from system behavior."},
            {chapter: 12, front: "Repository Federation", back: "Connecting multiple decentralized metadata repositories to share information without full physical consolidation."},
            {chapter: 12, front: "Data Provenance", back: "The documented history and chronological custody trail of a data asset's origin and lifecycle."},

            // Chapter 13
            {chapter: 13, front: "Definition of Data Quality", back: "The degree to which data is accurate, complete, consistent, timely, valid, and unique for its intended use."},
            {chapter: 13, front: "Data Quality Dimensions", back: "Key metrics: Accuracy, Completeness, Consistency, Timeliness, Validity, and Uniqueness."},
            {chapter: 13, front: "Accuracy", back: "The extent to which data correctly describes the 'real-world' object or event it represents."},
            {chapter: 13, front: "Completeness", back: "The proportion of stored data against the potential for 100% of the data to be stored."},
            {chapter: 13, front: "Consistency", back: "The absence of difference when comparing two or more representations of the same entity."},
            {chapter: 13, front: "Timeliness", back: "The degree to which data represents reality from the required point in time."},
            {chapter: 13, front: "Validity", back: "The degree to which data conforms to the syntax (format, type, range) of its definition."},
            {chapter: 13, front: "Uniqueness", back: "The condition where a real-world object is represented only once in the dataset."},
            {chapter: 13, front: "Data Profiling", back: "The process of examining data from an existing source and collecting statistics or summaries about it."},
            {chapter: 13, front: "Data Quality Assessment", back: "The activity of measuring data against defined business rules and data quality dimensions."},
            {chapter: 13, front: "Data Quality Issue Management", back: "The process of identifying, tracking, escalating, and resolving data quality problems."},
            {chapter: 13, front: "Root Cause Analysis (RCA)", back: "The methodical process of identifying the underlying causes of a data quality issue to prevent recurrence."},
            {chapter: 13, front: "Data Quality Business Rules", back: "Formalized definitions, constraints, and requirements that data must satisfy to be considered 'quality' for business usage."},
            {chapter: 13, front: "Cost of Poor Data Quality", back: "The negative financial impact resulting from rework, operational inefficiency, compliance failures, and poor decision-making."},
            {chapter: 13, front: "Data Quality Scorecard", back: "A reporting mechanism that provides a visual overview of data quality performance against targets."},
            {chapter: 13, front: "Data Cleansing", back: "The process of fixing, removing, or updating data that is incorrect, incomplete, or incorrectly formatted."},
            {chapter: 13, front: "Proactive vs. Reactive DQ", back: "Proactive: Designing systems to prevent errors. Reactive: Fixing errors after they have occurred."},
            {chapter: 13, front: "Data Stewardship Role in DQ", back: "Stewards define quality rules, identify issues, and advocate for data improvement within their domains."},
            {chapter: 13, front: "Metadata in DQ", back: "Provides the context (definitions, constraints, lineage) necessary to assess data quality."},
            {chapter: 13, front: "Data Quality Lifecycle", back: "Plan, Profile, Define Rules, Assess/Measure, Report, Remediate, and Improve."},
            {chapter: 13, front: "Master Data in DQ", back: "Since it is shared across systems, it requires the highest priority for quality measurement and remediation."},
            {chapter: 13, front: "Relationship: 1:N and DQ", back: "Complexity in cardinality (1:N) increases the risk of consistency and integrity errors during data movement."},
            {chapter: 13, front: "Operational Data Stores (ODS) and DQ", back: "Often the first line of defense for data quality by integrating data from multiple operational systems."},
            {chapter: 13, front: "Data Quality Maturity", back: "The evolution of the organization's ability to measure, manage, and prevent data quality issues."},
            {chapter: 13, front: "Total Data Quality Management (TDQM)", back: "A holistic approach that manages data as a product, focusing on the needs of data consumers."},

            // Chapter 14: Data Integration and Interoperability (Alt / Special Topic)
            {chapter: 14, front: "Enterprise Data Integration Strategy", back: "Planning how disparate systems interact across enterprise boundaries securely and efficiently."},
            {chapter: 14, front: "Middleware Technologies", back: "Software infrastructure facilitating communication and data translation between distributed applications."},
            {chapter: 14, front: "Message-Oriented Middleware (MOM)", back: "Infrastructure supporting asynchronous message passing and queueing between distributed systems."},
            {chapter: 14, front: "Data Integration Security", back: "Ensuring encrypted data transit and authenticated access credentials during ETL and API execution."},
            {chapter: 14, front: "Legacy Integration Challenges", back: "Overcoming rigid, outdated data structures and proprietary protocols when connecting modern apps."},
            {chapter: 14, front: "Enterprise Service Bus (ESB) Patterns", back: "A software architecture model used for routing, transforming, and orchestrating messages between mutually interacting services."},
            {chapter: 14, front: "API-Led Connectivity", back: "A methodical way to connect data to applications through a layered API approach: System, Process, and Experience APIs."},

            // Chapter 15: Data Ethics
            {chapter: 15, front: "Data Ethics", back: "A branch of applied ethics addressing the moral obligations regarding data generation, collection, analysis, and dissemination."},
            {chapter: 15, front: "Algorithmic Bias", back: "Systematic and repeatable errors in computer systems that create unfair outcomes or discriminate against groups."},
            {chapter: 15, front: "Informed Consent", back: "The ethical requirement that individuals clearly understand and agree to how their personal data will be used."},
            {chapter: 15, front: "Data Surveillance", back: "Continuous monitoring of behavior or data transactions, raising significant privacy and ethical concerns."},
            {chapter: 15, front: "Digital Ownership", back: "The ethical debate surrounding who owns and profits from personal data versus corporate aggregation."},
            {chapter: 15, front: "Transparency in AI and Analytics", back: "The moral responsibility to ensure data models and algorithmic decisions can be explained to affected users."},
            {chapter: 15, front: "Fairness and Non-Discrimination", back: "Ensuring data-driven decisions do not unfairly target, marginalize, or harm protected demographic classes."},
            {chapter: 15, front: "Data Minimization Principle", back: "Collecting only the personal data strictly necessary to achieve a specific business purpose, reducing ethical exposure."},
            {chapter: 15, front: "Moral Responsibility of Data Stewards", back: "Accountability for ensuring data governance frameworks uphold human dignity, privacy, and social welfare."}
        ];

        let currentViewData = [];
        let quizHistory = [];
        let userAnswers = {}; // Stores user selected answer text per question index
        let flaggedQuestions = new Set(); // Stores indices of flagged questions
        let currentIndex = 0;
        let timerInterval = null;
        let idleInterval = null;
        let secondsElapsed = 0;
        let idleTime = 0;
        const IDLE_LIMIT = 600; // 10 minutes in seconds

        const el = {
            filter: document.getElementById('chapter-filter'),
            flashView: document.getElementById('flashcard-container'),
            quizView: document.getElementById('quiz-container'),
            card: document.getElementById('main-card'),
            frontFace: document.getElementById('card-front-face'),
            backFace: document.getElementById('card-back-face'),
            front: document.getElementById('front-text'),
            back: document.getElementById('back-text'),
            chLabel: document.getElementById('card-chapter-label'),
            counter: document.getElementById('counter'),
            studyBtn: document.getElementById('study-mode-btn'),
            quizBtn: document.getElementById('quiz-mode-btn'),
            examBtn: document.getElementById('exam-mode-btn'),
            quizProgress: document.getElementById('quiz-progress'),
            completionBar: document.getElementById('completion-progress-bar'),
            navigatorGrid: document.getElementById('question-navigator-grid'),
            quizQuestion: document.getElementById('quiz-question'),
            quizOptions: document.getElementById('quiz-options'),
            quizFeedback: document.getElementById('quiz-feedback'),
            quizPrev: document.getElementById('quiz-prev-btn'),
            quizSkip: document.getElementById('quiz-skip-btn'),
            quizNext: document.getElementById('quiz-next-btn'),
            flagBtn: document.getElementById('flag-btn'),
            timerDisplay: document.getElementById('timer-display'),
            timerBadge: document.getElementById('timer-badge')
        };

        function isSpecialChapter(chNum) {
            return [9, 11, 14, 15].includes(parseInt(chNum));
        }

        function updateView() {
            const f = el.filter.value;
            currentViewData = f === 'all' ? [...allData] : allData.filter(d => d.chapter == parseInt(f));
            currentIndex = 0;
        }

        function renderCard() {
            if(currentViewData.length === 0) return;
            const d = currentViewData[currentIndex];
            el.card.classList.remove('is-flipped');
            el.front.innerText = d.front;
            el.back.innerText = d.back;
            
            if (isSpecialChapter(d.chapter)) {
                el.chLabel.innerText = `Ch ${d.chapter} (Specialized)`;
                el.chLabel.className = "absolute top-4 left-4 text-xs font-bold text-amber-600 uppercase";
                el.frontFace.className = "card-face card-front bg-amber-50/50 rounded-2xl shadow-xl border-t-4 border-amber-500 flex flex-col items-center justify-center p-8 text-center";
                el.backFace.className = "card-face card-back bg-amber-50 rounded-2xl shadow-xl border-t-4 border-amber-600 flex items-center justify-center p-8 text-center";
            } else {
                el.chLabel.innerText = `Ch ${d.chapter}`;
                el.chLabel.className = "absolute top-4 left-4 text-xs font-bold text-blue-500 uppercase";
                el.frontFace.className = "card-face card-front bg-white rounded-2xl shadow-xl border-t-4 border-blue-600 flex flex-col items-center justify-center p-8 text-center";
                el.backFace.className = "card-face card-back bg-blue-50 rounded-2xl shadow-xl border-t-4 border-emerald-500 flex items-center justify-center p-8 text-center";
            }

            el.counter.innerText = `${currentIndex + 1} / ${currentViewData.length}`;
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            if(idleInterval) clearInterval(idleInterval);

            secondsElapsed = 0;
            idleTime = 0;
            el.timerDisplay.innerText = "00:00";
            el.timerBadge.className = "flex items-center gap-1.5 px-3.5 py-1.5 bg-slate-100 text-slate-800 rounded-full font-mono text-base font-black shadow-sm tracking-wider";

            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                el.timerDisplay.innerText = `${mins}:${secs}`;
            }, 1000);

            idleInterval = setInterval(() => {
                idleTime++;
                if (idleTime >= IDLE_LIMIT) {
                    stopTimer();
                    triggerIdleTimeout();
                }
            }, 1000);
        }

        function stopTimer() {
            if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            if(idleInterval) { clearInterval(idleInterval); idleInterval = null; }
        }

        function resetIdleTimer() {
            if (timerInterval) idleTime = 0;
        }

        function triggerIdleTimeout() {
            el.quizQuestion.innerText = `Session Paused: 10 Minutes of Inactivity`;
            el.timerBadge.className = "flex items-center gap-1.5 px-3.5 py-1.5 bg-red-100 text-red-700 rounded-full font-mono text-base font-black shadow-sm tracking-wider";
            el.quizOptions.innerHTML = `
                <div class="text-center py-8 bg-red-50 rounded-2xl border border-red-100 space-y-3">
                    <div class="text-xl font-bold text-red-900">Timeout Detected</div>
                    <p class="text-gray-600 font-medium">Your session was paused due to no interaction for over 10 minutes.</p>
                </div>
            `;
            el.quizFeedback.classList.add('hidden');
            el.quizPrev.classList.add('hidden');
            el.quizSkip.classList.add('hidden');
            el.quizNext.classList.add('hidden');
            el.flagBtn.classList.add('hidden');
        }

        function startQuiz() {
            el.flashView.classList.add('hidden');
            el.quizView.classList.remove('hidden');
            updateView();
            quizHistory = [...currentViewData].sort(() => Math.random() - 0.5);
            userAnswers = {};
            flaggedQuestions.clear();
            currentIndex = 0;
            startTimer();
            showQuestion();
        }

        function startExamMode() {
            el.flashView.classList.add('hidden');
            el.quizView.classList.remove('hidden');
            
            let weightedPool = [];
            allData.forEach(item => {
                let weight = isSpecialChapter(item.chapter) ? 1 : 3;
                for(let i = 0; i < weight; i++) weightedPool.push(item);
            });

            weightedPool.sort(() => Math.random() - 0.5);
            let uniqueMap = new Map();
            for(let item of weightedPool) {
                if(!uniqueMap.has(item.front)) uniqueMap.set(item.front, item);
                if(uniqueMap.size >= 100) break;
            }

            quizHistory = Array.from(uniqueMap.values()).sort(() => Math.random() - 0.5);
            userAnswers = {};
            flaggedQuestions.clear();
            currentIndex = 0;
            startTimer();
            showQuestion();
        }

        function updateProgressBars() {
            const total = quizHistory.length;
            const answeredCount = Object.keys(userAnswers).length;
            const percent = Math.round((answeredCount / total) * 100);
            
            // Completion bar width update
            el.completionBar.style.width = `${percent}%`;
            el.quizProgress.innerText = `Answered: ${answeredCount}/${total} (${percent}%)`;

            // Render Navigator Grid Bar
            el.navigatorGrid.innerHTML = '';
            quizHistory.forEach((_, idx) => {
                const box = document.createElement('button');
                let bgClass = "bg-white border-gray-300 text-gray-700";
                
                if (idx === currentIndex) {
                    bgClass = "bg-blue-600 border-blue-600 text-white font-bold ring-2 ring-blue-300";
                } else if (flaggedQuestions.has(idx)) {
                    bgClass = "bg-amber-400 border-amber-500 text-amber-950 font-bold";
                } else if (userAnswers[idx] !== undefined) {
                    bgClass = "bg-emerald-500 border-emerald-600 text-white font-semibold";
                }

                box.className = `w-7 h-7 rounded-md border text-xs font-semibold flex items-center justify-center transition hover:scale-105 ${bgClass}`;
                box.innerText = idx + 1;
                box.onclick = () => {
                    resetIdleTimer();
                    currentIndex = idx;
                    showQuestion();
                };
                el.navigatorGrid.appendChild(box);
            });
        }

        function showQuestion() {
            const d = quizHistory[currentIndex];
            const headerTitle = quizHistory.length === 100 ? `100-Question Exam Simulation` : `Chapter Quiz`;
            document.getElementById('quiz-title').innerText = headerTitle;
            
            el.quizQuestion.innerText = `What is the definition of "${d.front}"?`;
            el.quizFeedback.classList.add('hidden');
            
            // Flag Button State
            if (flaggedQuestions.has(currentIndex)) {
                el.flagBtn.innerHTML = `<span>🚩 Flagged</span>`;
                el.flagBtn.className = "text-xs font-semibold px-3 py-1 bg-amber-500 text-white rounded-lg shadow-sm transition flex items-center gap-1";
            } else {
                el.flagBtn.innerHTML = `<span>🚩 Flag for Review</span>`;
                el.flagBtn.className = "text-xs font-semibold px-3 py-1 bg-amber-100 text-amber-800 rounded-lg hover:bg-amber-200 transition flex items-center gap-1";
            }

            // Navigation button states
            el.quizPrev.style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            
            if (currentIndex === quizHistory.length - 1) {
                el.quizNext.innerText = "Submit Exam / Quiz 🎯";
            } else {
                el.quizNext.innerText = "Next Question →";
            }

            // Generate Options
            let options = [d.back];
            while(options.length < 4) {
                let randomBack = allData[Math.floor(Math.random()*allData.length)].back;
                if(!options.includes(randomBack)) options.push(randomBack);
            }
            options.sort(() => Math.random() - 0.5);

            el.quizOptions.innerHTML = '';
            options.forEach((opt, idx) => {
                const letters = ['A', 'B', 'C', 'D'];
                const btn = document.createElement('button');
                
                let isSelected = userAnswers[currentIndex] === opt;
                let btnStyle = "border-gray-200 bg-white hover:border-blue-400 hover:bg-blue-50/50 text-gray-700";
                let badgeStyle = "bg-gray-100 border-gray-200 text-gray-500";

                if (isSelected) {
                    btnStyle = "border-blue-600 bg-blue-50/80 text-blue-900 font-semibold shadow-md";
                    badgeStyle = "bg-blue-600 text-white";
                }

                btn.className = `option-btn w-full text-left p-4 rounded-2xl border-2 ${btnStyle} flex items-center gap-4 font-medium shadow-sm`;
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-xl ${badgeStyle} border flex items-center justify-center font-bold text-sm shrink-0">${letters[idx]}</span>
                    <span class="flex-1">${opt}</span>
                `;

                btn.onclick = () => {
                    resetIdleTimer();
                    userAnswers[currentIndex] = opt;
                    updateProgressBars();
                    showQuestion(); // Re-render to show selected styling immediately
                };
                el.quizOptions.appendChild(btn);
            });

            updateProgressBars();
        }

        // Action controls
        el.flagBtn.onclick = () => {
            resetIdleTimer();
            if (flaggedQuestions.has(currentIndex)) {
                flaggedQuestions.delete(currentIndex);
            } else {
                flaggedQuestions.add(currentIndex);
            }
            showQuestion();
        };

        el.quizPrev.onclick = () => {
            resetIdleTimer();
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion();
            }
        };

        el.quizSkip.onclick = () => {
            resetIdleTimer();
            if (currentIndex < quizHistory.length - 1) {
                currentIndex++;
                showQuestion();
            } else {
                alert("You are on the last question. Use 'Submit Exam / Quiz' to finish.");
            }
        };

        el.card.onclick = () => el.card.classList.toggle('is-flipped');
        document.getElementById('next-btn').onclick = () => { currentIndex = (currentIndex + 1) % currentViewData.length; renderCard(); };
        document.getElementById('prev-btn').onclick = () => { currentIndex = (currentIndex - 1 + currentViewData.length) % currentViewData.length; renderCard(); };
        
        el.studyBtn.onclick = () => { 
            stopTimer();
            el.quizView.classList.add('hidden'); 
            el.flashView.classList.remove('hidden'); 
            updateView(); 
            renderCard(); 
        };
        
        el.quizBtn.onclick = startQuiz;
        el.examBtn.onclick = startExamMode;
        
        el.quizNext.onclick = () => {
            resetIdleTimer();
            if (currentIndex < quizHistory.length - 1) {
                currentIndex++;
                showQuestion();
            } else {
                // Submit screen calculation
                stopTimer();
                let correctCount = 0;
                quizHistory.forEach((item, idx) => {
                    if (userAnswers[idx] === item.back) correctCount++;
                });

                const finalScore = Math.round((correctCount / quizHistory.length) * 100);
                const finalTimeStr = el.timerDisplay.innerText;
                
                el.quizView.querySelector('.mb-6').classList.add('hidden'); // Hide top header elements
                el.completionBar.parentElement.classList.add('hidden');
                el.navigatorGrid.parentElement.classList.add('hidden');
                el.flagBtn.classList.add('hidden');
                el.quizPrev.classList.add('hidden');
                el.quizSkip.classList.add('hidden');
                el.quizNext.classList.add('hidden');

                el.quizQuestion.innerText = `Exam Simulation Results Summary`;
                el.quizOptions.innerHTML = `
                    <div class="text-center py-8 bg-slate-50 rounded-2xl border border-slate-100 space-y-4">
                        <div class="text-6xl font-black text-blue-900">${finalScore}%</div>
                        <p class="text-gray-700 font-semibold text-lg">You answered ${correctCount} out of ${quizHistory.length} questions correctly.</p>
                        <div class="flex justify-center gap-4">
                            <div class="inline-flex items-center gap-2 px-4 py-2 bg-blue-100 text-blue-800 rounded-full text-sm font-bold shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                Total Time: ${finalTimeStr}
                            </div>
                            <div class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-100 text-emerald-800 rounded-full text-sm font-bold shadow-sm">
                                <span>Answered: ${Object.keys(userAnswers).length}/${quizHistory.length}</span>
                            </div>
                        </div>
                        <button onclick="location.reload()" class="mt-4 px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition">Retake Exam</button>
                    </div>
                `;
                el.quizFeedback.classList.add('hidden');
            }
        };

        // Listen for user activity events to reset idle counter
        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('keypress', resetIdleTimer);
        window.addEventListener('click', resetIdleTimer);
        window.addEventListener('scroll', resetIdleTimer);

        updateView();
        renderCard();
    </script>
</body>
</html>
