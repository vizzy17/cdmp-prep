<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDMP Master Engine - Passing Engine Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">CDMP Master Engine</span>
            <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">DAMA Priority Suite</span>
        </div>
        <nav class="flex flex-wrap gap-2 text-sm text-slate-300 mt-2 sm:mt-0">
            <button onclick="switchTab('practice')" class="nav-btn px-3 py-1.5 rounded bg-blue-600 text-white font-medium transition">⚡ Practice</button>
            <button onclick="switchTab('exam')" class="nav-btn px-3 py-1.5 rounded hover:bg-slate-700 transition">📝 Exam Sim</button>
            <button onclick="switchTab('analytics')" class="nav-btn px-3 py-1.5 rounded hover:bg-slate-700 transition">📊 Analytics</button>
            <button onclick="switchTab('bookmarks')" class="nav-btn px-3 py-1.5 rounded hover:bg-slate-700 transition">⭐ Bookmarks (<span id="bookmarkCount">0</span>)</button>
        </nav>
    </header>

    <main class="flex-grow flex flex-col items-center justify-start p-6 max-w-4xl mx-auto w-full">
        <div id="view-practice" class="w-full space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Source Priority:</label>
                    <select id="batchSelect" onchange="filterQuestions()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100">
                        <option value="all">All Batches</option>
                        <option value="⭐ Official DAMA-Core Priority">⭐ Official DAMA-Core Priority</option>
                        <option value="New DMF PRA Batch">New DMF PRA Batch</option>
                        <option value="Legacy Bank Batch">Legacy Bank Batch</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Strategic Tier:</label>
                    <select id="tierSelect" onchange="filterQuestions()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100">
                        <option value="all">All Tiers</option>
                        <option value="Tier 1: Role & Responsibility">Tier 1: Role & Responsibility</option>
                        <option value="Tier 2: Process & Lifecycle">Tier 2: Process & Lifecycle</option>
                        <option value="Tier 3: Distinction & Definitions">Tier 3: Distinction & Definitions</option>
                        <option value="Tier 4: Facts & Numerical Thresholds">Tier 4: Facts & Numerical Thresholds</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Chapter:</label>
                    <select id="domainSelect" onchange="filterQuestions()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100">
                        <option value="all">All Chapters</option>
                    </select>
                </div>
            </div>

            <div class="w-full bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl relative">
                <div class="flex justify-between items-center mb-3 text-xs text-slate-400">
                    <span id="cardMeta">Batch | Domain | Tier</span>
                    <button id="bookmarkBtn" onclick="toggleBookmark()" class="text-slate-500 hover:text-yellow-400 text-lg transition">⭐</button>
                </div>
                <div id="questionContainer" class="space-y-4">
                    <h3 id="questionText" class="text-lg font-semibold text-slate-100">Loading master question repository...</h3>
                    <div id="optionsContainer" class="space-y-2"></div>
                </div>
                <div id="eliminationBox" class="mt-6 hidden bg-slate-900/80 border border-slate-700 rounded-lg p-4 space-y-2 text-sm">
                    <h4 class="font-bold text-blue-400">🛡️ DAMA Elimination Analysis</h4>
                    <p id="eliminationText" class="text-slate-300"></p>
                </div>
                <div class="mt-6 flex justify-between items-center pt-4 border-t border-slate-700">
                    <button onclick="prevQuestion()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">⬅ Previous</button>
                    <span class="text-xs text-slate-400">Card <span id="currentIndex">0</span> of <span id="totalQuestions">0</span></span>
                    <button onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition">Next ➡</button>
                </div>
            </div>
        </div>

        <div id="view-exam" class="w-full space-y-6 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center space-y-4">
                <h2 class="text-2xl font-bold">CDMP Exam Simulation</h2>
                <button onclick="startExam()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold">🚀 Start 90-Min Exam (100 Qs)</button>
                <div id="examActiveContainer" class="text-left space-y-4 hidden"></div>
            </div>
        </div>

        <div id="view-analytics" class="w-full space-y-4 hidden">
            <h2 class="text-xl font-bold">Analytics & Repositories</h2>
            <div id="analyticsContent" class="space-y-2 text-sm text-slate-300"></div>
        </div>

        <div id="view-bookmarks" class="w-full space-y-4 hidden">
            <h2 class="text-xl font-bold">Saved Bookmarks</h2>
            <div id="bookmarksContainer" class="space-y-3"></div>
        </div>
    </main>

    <script>
        let allQuestions = [];
        let filteredQuestions = [];
        let currentIndex = 0;
        let bookmarks = new Set(JSON.parse(localStorage.getItem('cdmp_bookmarks') || '[]'));

        // Dual path fetch fallback for absolute reliability on GitHub Pages
        async function loadData() {
            const paths = ['./code/questions.json', './questions.json', 'code/questions.json', 'questions.json'];
            let data = null;
            for (let path of paths) {
                try {
                    let res = await fetch(path);
                    if (res.ok) {
                        data = await res.json();
                        break;
                    }
                } catch(e) {}
            }

            if (!data) {
                document.getElementById('questionText').innerText = "Error: Could not locate questions.json in repository path.";
                return;
            }

            allQuestions = data.map((q, idx) => {
                let rawOptions = q.options || [];
                let originalCorrect = q.correct !== undefined ? q.correct : 0;
                let paired = rawOptions.map((opt, i) => ({ opt, i }));
                
                for (let i = paired.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [paired[i], paired[j]] = [paired[j], paired[i]];
                }

                let shuffledOptions = paired.map(p => p.opt);
                let newCorrect = paired.findIndex(p => p.i === originalCorrect);

                let rawSource = String(q.source || q.batch || "").toLowerCase();
                let text = (q.question || "").toLowerCase();
                let batch = "Legacy Bank Batch";
                if (rawSource.includes("dama") || rawSource.includes("official") || text.includes("fundamental")) {
                    batch = "⭐ Official DAMA-Core Priority";
                } else if (rawSource.includes("pra") || rawSource.includes("new")) {
                    batch = "New DMF PRA Batch";
                }

                let tier = "Tier 4: Facts & Numerical Thresholds";
                if (text.includes("who is") || text.includes("responsible") || text.includes("steward") || text.includes("committee")) tier = "Tier 1: Role & Responsibility";
                else if (text.includes("not") || text.includes("phase") || text.includes("lifecycle") || text.includes("step")) tier = "Tier 2: Process & Lifecycle";
                else if (text.includes("difference") || text.includes("distinguish") || text.includes("vs")) tier = "Tier 3: Distinction & Definitions";

                return {
                    id: q.id || idx + 1,
                    domain: q.domain || "General Data Management",
                    source_batch: batch,
                    tier: tier,
                    question: q.question || "",
                    options: shuffledOptions,
                    correct: newCorrect !== -1 ? newCorrect : 0,
                    explanation: q.explanation || "Refer to DAMA guidelines."
                };
            });

            populateDropdowns();
            filterQuestions();
            updateBookmarkCount();
        }

        loadData();

        function populateDropdowns() {
            let domains = [...new Set(allQuestions.map(q => q.domain))].sort();
            let domainSelect = document.getElementById('domainSelect');
            domains.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d;
                opt.innerText = d;
                domainSelect.appendChild(opt);
            });
        }

        function switchTab(tab) {
            ['practice', 'exam', 'analytics', 'bookmarks'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
        }

        function filterQuestions() {
            let batch = document.getElementById('batchSelect').value;
            let tier = document.getElementById('tierSelect').value;
            let domain = document.getElementById('domainSelect').value;

            filteredQuestions = allQuestions.filter(q => {
                return (batch === 'all' || q.source_batch === batch) &&
                       (tier === 'all' || q.tier === tier) &&
                       (domain === 'all' || q.domain === domain);
            });

            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (filteredQuestions.length === 0) {
                document.getElementById('questionText').innerText = "No questions match the selected filter criteria.";
                document.getElementById('optionsContainer').innerHTML = "";
                document.getElementById('cardMeta').innerText = "0 matches";
                document.getElementById('currentIndex').innerText = 0;
                document.getElementById('totalQuestions').innerText = 0;
                document.getElementById('eliminationBox').classList.add('hidden');
                return;
            }

            let q = filteredQuestions[currentIndex];
            document.getElementById('cardMeta').innerText = `${q.source_batch} | ${q.domain} | ${q.tier}`;
            document.getElementById('currentIndex').innerText = currentIndex + 1;
            document.getElementById('totalQuestions').innerText = filteredQuestions.length;
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('eliminationBox').classList.add('hidden');

            let isBookmarked = bookmarks.has(q.id);
            document.getElementById('bookmarkBtn').style.color = isBookmarked ? '#facc15' : '#64748b';

            let optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = "";
            q.options.forEach((opt, i) => {
                let btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-lg bg-slate-700/50 hover:bg-slate-700 border border-slate-700 text-sm flex gap-3 transition";
                btn.innerHTML = `<span class="font-bold text-blue-400">${String.fromCharCode(65 + i)}.</span> <span>${opt}</span>`;
                btn.onclick = () => {
                    let buttons = optContainer.children;
                    for(let j=0; j<buttons.length; j++) {
                        buttons[j].disabled = true;
                        if(j === q.correct) buttons[j].classList.add('bg-emerald-900/60', 'border-emerald-500');
                        else if(j === i) buttons[j].classList.add('bg-rose-900/60', 'border-rose-500');
                    }
                    document.getElementById('eliminationText').innerHTML = `<strong>Winning Choice:</strong> Option ${String.fromCharCode(65 + q.correct)}<br><br><em>💡 DMBoK Explanation:</em> ${q.explanation}`;
                    document.getElementById('eliminationBox').classList.remove('hidden');
                };
                optContainer.appendChild(btn);
            });
        }

        function nextQuestion() { if(currentIndex < filteredQuestions.length - 1) { currentIndex++; renderQuestion(); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }

        function toggleBookmark() {
            let q = filteredQuestions[currentIndex];
            if(!q) return;
            if(bookmarks.has(q.id)) bookmarks.delete(q.id);
            else bookmarks.add(q.id);
            localStorage.setItem('cdmp_bookmarks', JSON.stringify([...bookmarks]));
            updateBookmarkCount();
            renderQuestion();
        }

        function updateBookmarkCount() {
            document.getElementById('bookmarkCount').innerText = bookmarks.size;
        }

        function startExam() {
            alert("Exam Simulation Mode active. Use Streamlit or full view suite for timed 100-question execution.");
        }
    </script>
</body>
</html>
