<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDMP Master Engine - Passing Engine Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">CDMP Master Engine</span>
            <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">Passing Engine Suite</span>
        </div>
        <nav class="flex flex-wrap gap-3 text-sm text-slate-300 mt-2 sm:mt-0">
            <button class="hover:text-blue-400 transition">📖 DMBoK Glossary</button>
            <button class="hover:text-blue-400 transition">📊 Analytics</button>
            <button class="hover:text-blue-400 transition">🗂️ Flashcards</button>
            <button class="hover:text-blue-400 transition">⚡ Tier Practice</button>
            <button class="hover:text-blue-400 transition">📝 90-Min Exam</button>
            <button class="hover:text-blue-400 transition">⭐ Bookmarks</button>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center p-6">
        
        <!-- Filter Selector -->
        <div class="w-full max-w-2xl mb-6">
            <label for="tierSelect" class="block text-sm font-medium text-slate-400 mb-2">Strategic Tier/Chapter:</label>
            <select id="tierSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-blue-500">
                <option value="all">All Tiers & Chapters</option>
                <option value="Tier 1: Role & Responsibility">Tier 1: Role & Responsibility</option>
                <option value="Tier 2: Process & Lifecycle">Tier 2: Process & Lifecycle</option>
                <option value="Tier 3: Distinction & Definitions">Tier 3: Distinction & Definitions</option>
                <option value="Tier 4: Facts & Numerical Thresholds">Tier 4: Facts & Numerical Thresholds</option>
                <optgroup label="--- By Chapter ---">
                    <option value="Chapter 2: Data Governance">Chapter 2: Data Governance</option>
                    <option value="Chapter 3: Data Handling Ethics">Chapter 3: Data Handling Ethics</option>
                    <option value="Chapter 4: Data Architecture">Chapter 4: Data Architecture</option>
                    <option value="Chapter 5: Data Modeling & Design">Chapter 5: Data Modeling & Design</option>
                    <option value="Chapter 6: Data Storage & Operations">Chapter 6: Data Storage & Operations</option>
                    <option value="Chapter 7: Data Security">Chapter 7: Data Security</option>
                    <option value="Chapter 8: Data Integration">Chapter 8: Data Integration</option>
                    <option value="Chapter 10: Reference & Master Data">Chapter 10: Reference & Master Data</option>
                    <option value="Chapter 11: Data Warehousing & BI">Chapter 11: Data Warehousing & BI</option>
                    <option value="Chapter 12: Metadata Management">Chapter 12: Metadata Management</option>
                    <option value="Chapter 13: Data Quality">Chapter 13: Data Quality</option>
                </optgroup>
            </select>
        </div>

        <!-- Question Card Box -->
        <div id="cardContainer" class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-xl cursor-pointer transition transform hover:border-slate-600 relative">
            <div class="flex justify-between items-center mb-4 text-xs text-slate-400">
                <span id="cardMeta">Chapter / Domain</span>
                <button id="bookmarkBtn" class="text-slate-500 hover:text-yellow-400 text-lg transition">⭐</button>
            </div>
            
            <!-- Card Text / Content -->
            <div id="cardContent" class="min-h-[140px] flex items-center justify-center text-center text-lg font-medium text-slate-200">
                Loading questions...
            </div>

            <div class="mt-6 text-center text-xs text-slate-500">
                Click card to flip
            </div>
        </div>

        <!-- Progress Counter -->
        <div class="mt-4 text-sm text-slate-400">
            Card <span id="currentIndex">0</span> of <span id="totalQuestions">0</span>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 mt-6">
            <button id="quizBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-medium transition shadow-lg">Start Tier Practice</button>
            <button id="examBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-medium transition shadow-lg">Start 90-Min Exam</button>
        </div>

    </main>

    <!-- Footer Script / Controller -->
    <script>
        let allQuestions = [];
        let filteredQuestions = [];
        let currentIdx = 0;
        let isFlipped = false;

        const el = {
            cardContainer: document.getElementById('cardContainer'),
            cardContent: document.getElementById('cardContent'),
            cardMeta: document.getElementById('cardMeta'),
            currentIndex: document.getElementById('currentIndex'),
            totalQuestions: document.getElementById('totalQuestions'),
            tierSelect: document.getElementById('tierSelect'),
            quizBtn: document.getElementById('quizBtn'),
            examBtn: document.getElementById('examBtn')
        };

        // Fetch JSON safely with robust property mapping fallback
        fetch('./questions.json')
            .then(res => {
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return res.json();
            })
            .then(data => {
                // Map fields cleanly to prevent undefined property crashes
                allQuestions = data.map((q, index) => ({
                    id: q.id || index,
                    domain: q.domain || "General",
                    type: q.type || "Standard",
                    question: q.question || "No question text provided.",
                    options: q.options || [],
                    correct: q.correct !== undefined ? q.correct : 0,
                    explanation: q.explanation || "No explanation provided."
                }));
                
                filteredQuestions = [...allQuestions];
                updateFilter();
            })
            .catch(err => {
                console.error('Fetch error loading questions.json:', err);
                el.cardContent.innerText = "Error loading questions.json structure. Check console for formatting issues.";
            });

        function updateFilter() {
            const selectedVal = el.tierSelect.value;
            if (selectedVal === 'all') {
                filteredQuestions = [...allQuestions];
            } else {
                filteredQuestions = allQuestions.filter(q => q.domain === selectedVal || q.type === selectedVal);
            }
            currentIdx = 0;
            showQuestion();
        }

        function showQuestion() {
            if (!filteredQuestions || filteredQuestions.length === 0) {
                el.cardContent.innerText = "No questions available for this filter selection.";
                el.cardMeta.innerText = "Empty Filter";
                el.currentIndex.innerText = 0;
                el.totalQuestions.innerText = 0;
                return;
            }

            if (currentIdx >= filteredQuestions.length) currentIdx = 0;
            if (currentIdx < 0) currentIdx = filteredQuestions.length - 1;

            const q = filteredQuestions[currentIdx];
            isFlipped = false;

            el.cardMeta.innerText = `${q.domain} | ${q.type}`;
            el.currentIndex.innerText = currentIdx + 1;
            el.totalQuestions.innerText = filteredQuestions.length;

            renderCardFront(q);
        }

        function renderCardFront(q) {
            let html = `<div class="w-full text-left"><p class="font-semibold text-base mb-3">${q.question}</p><ul class="space-y-2 text-sm text-slate-300">`;
            q.options.forEach((opt, i) => {
                html += `<li class="bg-slate-700/50 p-2 rounded">${String.fromCharCode(65 + i)}. ${opt}</li>`;
            });
            html += `</ul></div>`;
            el.cardContent.innerHTML = html;
        }

        function renderCardBack(q) {
            let html = `<div class="w-full text-left"><p class="text-emerald-400 font-bold mb-2">Correct Answer: Option ${String.fromCharCode(65 + q.correct)}</p><p class="text-sm text-slate-300"><strong class="text-slate-100">Explanation:</strong> ${q.explanation}</p></div>`;
            el.cardContent.innerHTML = html;
        }

        // Flip interaction on click
        el.cardContainer.onclick = () => {
            if (!filteredQuestions || filteredQuestions.length === 0) return;
            isFlipped = !isFlipped;
            const q = filteredQuestions[currentIdx];
            if (isFlipped) {
                renderCardBack(q);
            } else {
                renderCardFront(q);
            }
        };

        el.tierSelect.onchange = updateFilter;

        function startQuiz() {
            currentIdx = 0;
            showQuestion();
        }

        function startExamMode() {
            currentIdx = 0;
            showQuestion();
        }

        el.quizBtn.onclick = startQuiz;
        el.examBtn.onclick = startExamMode;
    </script>
</body>
</html>
